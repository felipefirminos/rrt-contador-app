# ALERTAS DE RISCO — teses que viraram RISCO, não oportunidade
# -------------------------------------------------------------------------
alertas_risco:

  - id: TEMA_985_STF_RISCO
    nome: "Contribuição patronal sobre terço constitucional de férias"
    leading_case: "RE 1.072.485"
    corte: "STF"
    tema_repercussao_geral: 985
    data_julgamento_merito: "2020-08-31"
    data_publicacao_ata: "2020-09-15"
    status_embargos: >
      Embargos de declaração e demais recursos sobre modulação foram
      discutidos em sessões posteriores — validar no portal do STF o
      ÚLTIMO andamento antes de orientar cliente. A modulação de
      15/09/2020 permanece como marco de referência.
    tese: >
      É legítima a incidência de contribuição social sobre o valor
      satisfeito a título de terço constitucional de férias
      (reviravolta em relação à jurisprudência anterior do STJ, que
      apontava não-incidência).
    modulacao:
      marco_temporal: "2020-09-15"
      regra: >
        Efeitos ex nunc a partir de 15/09/2020. Contribuições já pagas
        e não contestadas judicialmente até essa data NÃO são devolvidas
        pela União. Empresas com ação judicial protocolada até 15/09/2020
        podem recuperar retroativamente pelos 5 anos anteriores à
        propositura.
    classificacao: "RISCO para empresas que deixaram de recolher confiando em jurisprudência antiga do STJ. OPORTUNIDADE restrita a empresas com ação judicial ajuizada ANTES de 15/09/2020."
    acao_recomendada: >
      1. Verificar se a empresa tinha ação judicial sobre terço de férias
         protocolada antes de 15/09/2020 — se SIM, possibilidade de
         recuperação dos 5 anos pré-ação.
      2. Se NÃO tinha ação e deixou de recolher — autuação em aberto.
         Verificar eventual parcelamento, transação tributária ou
         regularização espontânea antes de fiscalização.
      3. Para períodos a partir de 15/09/2020 — contribuir normalmente.
    base_legal:
      - "RE 1.072.485 (Tema 985 STF)"
      - "Lei 8.212/1991, art. 28"
    fonte_oficial:
      - "https://portal.stf.jus.br/jurisprudenciaRepercussao/verAndamentoProcesso.asp?incidente=5255826"

